name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://mgkk:local-dev-password@localhost:5433/mgkk_test
      DATABASE_URL: postgresql+asyncpg://mgkk:local-dev-password@localhost:5433/mgkk_test
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mgkk_test
          POSTGRES_USER: mgkk
          POSTGRES_PASSWORD: local-dev-password
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mgkk -d mgkk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Lint backend
        run: uv run ruff check backend/app tests

      - name: Type-check backend
        run: uv run mypy backend/app

      - name: Apply migrations
        run: uv run alembic -c backend/alembic.ini upgrade head

      - name: Check migrations match models
        run: uv run alembic -c backend/alembic.ini check

      - name: Test backend
        run: uv run pytest

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build
