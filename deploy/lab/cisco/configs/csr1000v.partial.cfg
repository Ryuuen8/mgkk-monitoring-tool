! MGKK Cisco IOS-XE lab startup configuration.
! This file is a template. backend/scripts/render_cisco_lab_config.py writes
! the concrete .lab/cisco-lab-startup.cfg from .env.lab values.
hostname mgkk-cisco-lab
!
no ip domain lookup
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username __RESTCONF_USER__ privilege 15 secret __RESTCONF_PASSWORD__
!
snmp-server view MGKK iso included
snmp-server group MGKK v3 priv read MGKK
snmp-server user __SNMP_V3_USER__ MGKK v3 auth sha __SNMP_V3_AUTH__ priv aes 128 __SNMP_V3_PRIV__
snmp-server location MGKK isolated test lab
snmp-server contact lab@example.invalid
snmp-server enable traps snmp linkdown linkup
!
restconf
ip http secure-server
ip http authentication local
!
interface GigabitEthernet1
 description management
 ip address dhcp
 no shutdown
!
line vty 0 4
 transport input ssh
!
end
