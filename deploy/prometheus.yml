global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alert_relabel_configs:
    # Make each DeviceDown alert carry its own device_id in parent_device_id so
    # Alertmanager can inhibit alerts on downstream children by that label.
    - source_labels: [alertname, device_id]
      regex: 'DeviceDown;(.+)'
      target_label: parent_device_id
      replacement: '$1'
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: poller-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["poller-worker:9101"]
