[project]
name = "mgkk-monitoring-tool"
version = "0.1.0"
description = "MGKK monitoring tool backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "celery>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.115.0",
    "icmplib>=3.0.4",
    "mypy>=2.4.0",
    "netmiko>=4.8.0",
    "prometheus-client>=0.22.0",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pysnmp>=7.1.30",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=8.1.0",
    "ruff>=0.17.2",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["backend"]
